# Nginx جلوی سرور لایسنس. __DOMAIN__ توسط اسکریپت نصب جایگزین می‌شود.
limit_req_zone $binary_remote_addr zone=gamenet_api:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    server_tokens off;
    client_max_body_size 400m;  # برای آپلود آپدیت برنامه و بازیابی بکاپ

    location / {
        limit_req zone=gamenet_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
