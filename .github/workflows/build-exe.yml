name: Build Windows EXE (GameNet Manager)

# با هر تغییر در کد برنامه ویندوز، نسخه exe را می‌سازد و در بخش Releases می‌گذارد.
# - خودکار: push به main یا feature/secure-licensing (به‌جز تغییرات پوشه mobile)
# - نسخه: major.minor از version.json + patch خودکار (با هر کامیت یکی بالا می‌رود: 1.2.1، 1.2.2، ...)
#   برای آپدیت بزرگ (مثلاً 1.3) فقط minor را در version.json عوض کن؛ patch دوباره از 0 شروع می‌شود.
# - دستی: تب Actions ← Run workflow (با امکان تعیین نسخه)
# خروجی: GameNet-Manager-Setup-<نسخه>.exe (نصب) و GameNet-Manager-Portable-<نسخه>.exe (بدون نصب)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'نسخه (مثلاً 1.2.1) — خالی بگذار برای همان نسخه package.json'
        required: false
  push:
    branches: [main, feature/secure-licensing]
    paths:
      - 'src/**'
      - 'electron/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'version.json'
      - 'scripts/compute-version.mjs'
      - 'vite.config.ts'
      - '.github/workflows/build-exe.yml'

permissions:
  contents: write

concurrency:
  group: build-exe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: نصب وابستگی‌ها
        run: bun install

      - name: تعیین نسخه
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="$(node scripts/compute-version.mjs)"
          fi
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: بیلد رابط کاربری
        run: |
          npm run build
          test -f dist/index.html

      - name: پکیج ویندوز
        run: npx electron-builder --win --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: آپلود در Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: GameNet Manager ${{ env.APP_VERSION }}
          files: |
            dist-electron/*.exe
            dist-electron/*.yml
          body: |
            نسخه ویندوز GameNet Manager
            - Setup: نصب معمولی روی ویندوز
            - Portable: اجرا بدون نصب
          fail_on_unmatched_files: false
