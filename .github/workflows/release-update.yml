name: Release Update (GameNet Manager)

# ساخت کامل یک آپدیت آنلاین داخل گیت‌هاب:
#   نصب‌کننده x64 و ia32 + manifest.json + manifest.sig (امضاشده)
# خروجی در بخش Releases با تگ update-<نسخه> قرار می‌گیرد.
# بعد از اجرا: چهار فایل را از Releases دانلود کنید و در پنل مدیریت ← آپدیت‌ها آپلود کنید.
#
# نیاز: Secret به اسم UPDATE_SIGNING_PRIVATE_KEY (محتوای کامل فایل update-private.pem)
# و وجود electron/update-public.pem در ریپو.
#
# اجرا: تب Actions ← Release Update ← Run workflow

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'نسخه (مثلاً 2.0.1) — خالی بگذارید تا خودکار از version.json + تعداد کامیت‌ها محاسبه شود'
        required: false
      notes:
        description: 'توضیح کوتاه تغییرات (به مشتری نشان داده می‌شود)'
        required: true
        default: 'بهبود و رفع اشکال'

permissions:
  contents: write

concurrency:
  group: release-update
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: نصب وابستگی‌ها
        run: bun install

      - name: بررسی کلیدها
        shell: bash
        env:
          UPDATE_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$UPDATE_KEY" ]; then
            echo "::error::Secret به اسم UPDATE_SIGNING_PRIVATE_KEY تنظیم نشده است."
            exit 1
          fi
          if [ ! -f electron/update-public.pem ]; then
            echo "::error::فایل electron/update-public.pem در ریپو نیست (کلید عمومی را کامیت کنید)."
            exit 1
          fi
          mkdir -p update-signing
          printf '%s\n' "$UPDATE_KEY" > update-signing/update-private.pem

      - name: تعیین نسخه
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="$(node scripts/compute-version.mjs)"
          fi
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "نسخه: $VERSION"

      - name: ساخت و امضای آپدیت
        shell: bash
        env:
          INPUT_NOTES: ${{ inputs.notes }}
        run: node scripts/release.mjs "$APP_VERSION" "$INPUT_NOTES"

      - name: بررسی فایل‌های خروجی
        shell: bash
        run: |
          ls -la "release/$APP_VERSION"
          for f in "GameNet-Manager-Setup-$APP_VERSION-x64.exe" "GameNet-Manager-Setup-$APP_VERSION-ia32.exe" manifest.json manifest.sig; do
            test -f "release/$APP_VERSION/$f" || { echo "::error::$f ساخته نشد"; exit 1; }
          done

      - name: پاک کردن کلید خصوصی از runner
        if: always()
        shell: bash
        run: rm -rf update-signing

      - name: آپلود در Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: update-${{ env.APP_VERSION }}
          name: آپدیت ${{ env.APP_VERSION }}
          body: |
            فایل‌های آپدیت آنلاین GameNet Manager نسخه ${{ env.APP_VERSION }}
            هر ۴ فایل را دانلود کنید و در پنل مدیریت ← آپدیت‌ها با هم آپلود کنید.
          files: |
            release/${{ env.APP_VERSION }}/*
          fail_on_unmatched_files: true
