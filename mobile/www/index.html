<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GameNet Remote</title>
<meta name="theme-color" content="#0F1219" id="themeColor">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="GameNet">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
/* تم تیره (پیش‌فرض) */
:root{--bg:#0B0E14;--card:#141923;--line:#ffffff14;--tx:#F7FAFC;--mu:#8b95a7;--bl:#2563eb;--gr:#059669;--rd:#dc2626;--am:#d97706;
  --hdr:#0F1219;--soft:#ffffff14;--soft2:#ffffff0d;--ok-bg:#05966933;--ok-tx:#34d399;--warn-bg:#d9770633;--warn-tx:#fbbf24;--bad-tx:#f87171;--scrim:#000a;color-scheme:dark}
/* تم روشن: با تنظیم «روشن»، یا «خودکار» وقتی گوشی روی حالت روشن است */
:root[data-theme="light"]{--bg:#eef2f6;--card:#ffffff;--line:#0f172a1a;--tx:#0f172a;--mu:#5b6576;--hdr:#ffffff;--soft:#0f172a0f;--soft2:#0f172a0a;
  --ok-bg:#d1fae5;--ok-tx:#047857;--warn-bg:#fef3c7;--warn-tx:#b45309;--bad-tx:#dc2626;--scrim:#0f172a66;color-scheme:light}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#eef2f6;--card:#ffffff;--line:#0f172a1a;--tx:#0f172a;--mu:#5b6576;--hdr:#ffffff;--soft:#0f172a0f;--soft2:#0f172a0a;
  --ok-bg:#d1fae5;--ok-tx:#047857;--warn-bg:#fef3c7;--warn-tx:#b45309;--bad-tx:#dc2626;--scrim:#0f172a66;color-scheme:light}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,Tahoma,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{position:sticky;top:0;background:var(--hdr);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;z-index:5}
.dot{width:9px;height:9px;border-radius:50%;background:var(--rd);display:inline-block;margin-left:6px}.dot.ok{background:var(--gr)}
.tabs{display:flex;gap:8px;padding:12px 16px 0}
.tab{flex:1;padding:10px 4px;border-radius:12px;background:var(--card);border:1px solid var(--line);color:var(--mu);font-size:13px;font-weight:700;text-align:center}
.tab.on{background:var(--bl);color:#fff;border-color:var(--bl)}
main{padding:12px 16px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.name{font-weight:800;font-size:16px}.mu{color:var(--mu);font-size:12px}
.badge{font-size:11px;padding:3px 8px;border-radius:99px;background:var(--soft)}
.b-active{background:var(--ok-bg);color:var(--ok-tx)}.b-paused{background:var(--warn-bg);color:var(--warn-tx)}.b-inactive{background:var(--soft2);color:var(--mu)}
.timer{font-family:ui-monospace,monospace;font-size:22px;font-weight:800;margin:8px 0 4px;direction:ltr;text-align:right}
.cost{font-size:13px;margin-bottom:6px}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.acts button{flex:1;min-width:70px;padding:10px 6px;font-size:13px}
button{font:inherit;border:0;border-radius:12px;padding:11px 14px;font-weight:700;color:#fff;background:var(--bl)}
button.g{background:var(--gr)}button.a{background:var(--am)}button.r{background:var(--rd)}button.s{background:var(--soft);color:var(--tx)}
button:disabled{opacity:.45}
input,select{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--hdr);color:var(--tx);font:inherit;margin:6px 0}
.sheet{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:flex-end;z-index:20}
.sheet>div{width:100%;max-height:90vh;overflow:auto;background:var(--hdr);border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.seg{display:flex;gap:8px;margin:8px 0}.seg button{flex:1;background:var(--soft);color:var(--tx)}.seg button.on{color:#fff}.seg button.on{background:var(--bl)}
.err{color:var(--bad-tx);font-size:13px;min-height:18px;margin:6px 0}
.bal{font-weight:800}.pos{color:var(--bad-tx)}.zero{color:var(--ok-tx)}
.item{padding:8px 0;border-bottom:1px solid var(--line)}.item .nm{font-weight:700;font-size:14px}
.step{display:flex;align-items:center;gap:10px}.step button{width:38px;height:38px;padding:0;font-size:20px;background:var(--soft);color:var(--tx)}.step span{min-width:24px;text-align:center;font-weight:800}
.pk{max-height:42vh;overflow:auto;margin:8px 0}
.sum{display:flex;justify-content:space-between;font-size:14px;padding:3px 0}.sum.big{font-size:17px;font-weight:800;border-top:1px solid var(--line);margin-top:6px;padding-top:8px}
.tip{background:var(--warn-bg);color:var(--tx);border-radius:14px;padding:12px;font-size:13px;line-height:1.9;margin-bottom:10px}.tip b{color:var(--warn-tx)}
.conn{background:var(--warn-bg);border-radius:14px;padding:12px;margin:12px 16px 0;font-size:13px;line-height:1.8}.conn .acts{margin-top:8px}
.menu{display:grid;gap:8px}.menu button{text-align:right}
#menuBtn{background:var(--soft);color:var(--tx);padding:6px 10px;border-radius:10px;font-size:15px;margin-inline-start:6px}
.chk{display:flex;align-items:center;gap:8px;margin:10px 0;font-size:14px}.chk input{width:auto;margin:0}
#themeBtn{background:var(--soft);color:var(--tx);padding:6px 10px;border-radius:10px;font-size:15px;margin-inline-start:10px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom));background:#065f46;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;font-weight:700;z-index:50;display:none;max-width:90%;text-align:center}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet"></div>
<div id="toast"></div>
<script>
const LS = { url: 'gn_url', token: 'gn_token', name: 'gn_dev', theme: 'gn_theme' };

// ---------- حالت اجرا ----------
// NATIVE: اپ اندروید (APK)    WEB: باز شده از خود کامپیوتر (آیفون / هر مرورگر)
const NATIVE = !!(window.Capacitor && (window.Capacitor.isNativePlatform ? window.Capacitor.isNativePlatform() : true));
const WEB = !NATIVE && /^https?:$/.test(location.protocol);
const IOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const ANDROID = /Android/i.test(navigator.userAgent);
let apkLink = null; // لینک دانلود اپ اندروید از سرور لایسنس (از /api/ping کامپیوتر)
const STANDALONE = navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
const CONFIRM_LABEL = NATIVE ? 'تأیید با اثر انگشت' : 'تأیید با رمز';
const apiBase = () => (WEB ? location.origin : localStorage.getItem(LS.url));

// ---------- رمز تأیید (نسخه وب؛ جای اثر انگشت) ----------
// فقط روی همین گوشی، به صورت هش با salt ذخیره می‌شود. ۵ اشتباه = ۱ دقیقه قفل، ۱۰ اشتباه = لغو جفت‌سازی.
const PIN_KEY = 'gn_pin', PIN_FAIL = 'gn_pin_fail';
function sha256(ascii){function r(v,a){return(v>>>a)|(v<<(32-a))}var mp=Math.pow,mw=mp(2,32),res='',w=[],abl=ascii.length*8,h=sha256.h=sha256.h||[],k=sha256.k=sha256.k||[],pl=k.length,ic={},i,j;for(var c=2;pl<64;c++){if(!ic[c]){for(i=0;i<313;i+=c)ic[i]=c;h[pl]=(mp(c,.5)*mw)|0;k[pl++]=(mp(c,1/3)*mw)|0}}ascii+='\x80';while(ascii.length%64-56)ascii+='\x00';for(i=0;i<ascii.length;i++){j=ascii.charCodeAt(i);if(j>>8)return;w[i>>2]|=j<<((3-i)%4)*8}w[w.length]=((abl/mw)|0);w[w.length]=(abl);for(j=0;j<w.length;){var W=w.slice(j,j+=16),oh=h;h=h.slice(0,8);for(i=0;i<64;i++){var w15=W[i-15],w2=W[i-2],a=h[0],e=h[4],t1=h[7]+(r(e,6)^r(e,11)^r(e,25))+((e&h[5])^((~e)&h[6]))+k[i]+(W[i]=(i<16)?W[i]:(W[i-16]+(r(w15,7)^r(w15,18)^(w15>>>3))+W[i-7]+(r(w2,17)^r(w2,19)^(w2>>>10)))|0),t2=(r(a,2)^r(a,13)^r(a,22))+((a&h[1])^(a&h[2])^(h[1]&h[2]));h=[(t1+t2)|0].concat(h);h[4]=(h[4]+t1)|0}for(i=0;i<8;i++)h[i]=(h[i]+oh[i])|0}for(i=0;i<8;i++){for(j=3;j+1;j--){var b=(h[i]>>(j*8))&255;res+=((b<16)?0:'')+b.toString(16)}}return res}
function pinHash(pin, salt) { let x = salt + ':' + pin; for (let i = 0; i < 3000; i++) x = sha256(salt + x); return x; }
function setPin(pin) {
  const salt = Array.from({ length: 16 }, () => Math.floor(Math.random() * 256).toString(16).padStart(2, '0')).join('');
  localStorage.setItem(PIN_KEY, salt + '$' + pinHash(pin, salt));
}
function checkPin(pin) {
  const [salt, hash] = (localStorage.getItem(PIN_KEY) || '').split('$');
  return !!salt && pinHash(pin, salt) === hash;
}
function pinFails() { try { return JSON.parse(localStorage.getItem(PIN_FAIL)) || { n: 0, until: 0 }; } catch { return { n: 0, until: 0 }; } }
function pinLockLeft() { return Math.max(0, Math.ceil((pinFails().until - Date.now()) / 1000)); }

function pinPrompt(reason) {
  return new Promise((resolve, reject) => {
    const has = !!localStorage.getItem(PIN_KEY);
    const box = document.createElement('div');
    box.className = 'sheet'; box.style.zIndex = 40;
    box.innerHTML = `<div><div class="name">${has ? 'تأیید با رمز' : 'تعیین رمز تأیید'}</div>
      <div class="mu" style="margin:6px 0 8px">${esc(reason)}</div>
      ${has ? '' : '<div class="mu" style="margin-bottom:6px">این رمز فقط روی همین گوشی ذخیره می‌شود و برای تسویه، نسیه و پرداخت پرسیده می‌شود.</div>'}
      <input id="p1" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" placeholder="رمز ۴ تا ۶ رقمی">
      ${has ? '' : '<input id="p2" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" placeholder="تکرار رمز">'}
      <div class="err" id="perr"></div>
      <div class="row"><button class="s" id="pc" style="flex:1">انصراف</button><button id="po" style="flex:2">تأیید</button></div>
      ${has ? '<button class="s" id="pf" style="width:100%;margin-top:8px;font-size:12px">رمز را فراموش کرده‌ام</button>' : ''}</div>`;
    document.body.appendChild(box);
    const q = (x) => box.querySelector(x);
    const finish = (ok, msg) => { box.remove(); ok ? resolve(true) : reject(new Error(msg)); };
    setTimeout(() => q('#p1').focus(), 50);
    q('#pc').onclick = () => finish(false, 'تأیید لغو شد');
    if (has) q('#pf').onclick = () => {
      if (!confirm('برای ساختن رمز جدید، گوشی باید دوباره با کد کامپیوتر جفت شود. ادامه می‌دهید؟')) return;
      box.remove(); closeSheet(); unpair(); reject(new Error('جفت‌سازی دوباره لازم است'));
    };
    q('#po').onclick = () => {
      const v = toLatin(q('#p1').value);
      if (!/^\d{4,6}$/.test(v)) return (q('#perr').textContent = 'رمز باید ۴ تا ۶ رقم باشد');
      if (!has) {
        if (v !== toLatin(q('#p2').value)) return (q('#perr').textContent = 'تکرار رمز یکی نیست');
        setPin(v); return finish(true);
      }
      const left = pinLockLeft();
      if (left) return (q('#perr').textContent = `تلاش زیاد؛ ${fa(left)} ثانیه صبر کنید`);
      if (checkPin(v)) { localStorage.removeItem(PIN_FAIL); return finish(true); }
      const f = pinFails(); f.n += 1;
      if (f.n >= 10) { box.remove(); closeSheet(); unpair(); return reject(new Error('رمز ۱۰ بار اشتباه وارد شد؛ دسترسی این گوشی حذف شد')); }
      if (f.n % 5 === 0) f.until = Date.now() + 60000;
      localStorage.setItem(PIN_FAIL, JSON.stringify(f));
      q('#perr').textContent = 'رمز اشتباه است'; q('#p1').value = '';
    };
  });
}

// ---------- Theme: auto (مثل گوشی) / light / dark ----------
const THEMES = ['auto', 'light', 'dark'];
const THEME_ICON = { auto: '🌗', light: '☀️', dark: '🌙' };
const THEME_LABEL = { auto: 'خودکار (مثل گوشی)', light: 'روشن', dark: 'تیره' };
const themeMq = window.matchMedia('(prefers-color-scheme: light)');
function getTheme() { const t = localStorage.getItem(LS.theme); return THEMES.includes(t) ? t : 'auto'; }
function applyTheme() {
  const t = getTheme();
  if (t === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', t);
  const light = t === 'light' || (t === 'auto' && themeMq.matches);
  const meta = document.getElementById('themeColor');
  if (meta) meta.setAttribute('content', light ? '#ffffff' : '#0F1219');
  const b = document.getElementById('themeBtn');
  if (b) { b.textContent = THEME_ICON[t]; b.title = 'تم: ' + THEME_LABEL[t]; }
  // نوار وضعیت اندروید (اگر افزونه StatusBar نصب باشد)
  const SB = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.StatusBar;
  if (SB) { SB.setStyle({ style: light ? 'LIGHT' : 'DARK' }).catch(() => {}); SB.setBackgroundColor && SB.setBackgroundColor({ color: light ? '#ffffff' : '#0F1219' }).catch(() => {}); }
}
function cycleTheme() {
  const t = THEMES[(THEMES.indexOf(getTheme()) + 1) % THEMES.length];
  localStorage.setItem(LS.theme, t);
  applyTheme();
  toast('تم: ' + THEME_LABEL[t]);
}
themeMq.addEventListener ? themeMq.addEventListener('change', applyTheme) : themeMq.addListener(applyTheme);
applyTheme();
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fa = (n) => Number(n).toLocaleString('fa-IR');
const money = (n) => fa(Math.round(n || 0)) + ' ت';
const toLatin = (s) => String(s).replace(/[۰-۹]/g, (d) => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g, (d) => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[,٬،\s]/g, '');
const rid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random().toString(36).slice(2));
const sysById = (id) => state && state.systems.find((x) => x.id === id);

let state = null, skew = 0, online = false, tab = 'systems', saleCart = {}, salePay = null;

function toast(msg, bad) {
  const t = $('#toast'); t.textContent = msg; t.style.background = bad ? '#991b1b' : '#065f46'; t.style.display = 'block';
  clearTimeout(toast._t); toast._t = setTimeout(() => (t.style.display = 'none'), 3500);
}

async function api(path, opts = {}) {
  const base = apiBase(), token = localStorage.getItem(LS.token);
  const ctrl = new AbortController(), t = setTimeout(() => ctrl.abort(), 8000);
  try {
    const r = await fetch(base + path, {
      ...opts, signal: ctrl.signal,
      headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}) },
    });
    const j = await r.json().catch(() => ({}));
    if (r.status === 401 && token && path !== '/api/pair') { unpair(); throw new Error('دسترسی این گوشی لغو شده است'); }
    if (!r.ok) throw new Error(j.error || 'خطا ' + r.status);
    return j;
  } catch (e) {
    if (e.name === 'AbortError') throw new Error('پاسخی از کامپیوتر نیامد');
    throw e;
  } finally { clearTimeout(t); }
}

async function bio(reason) {
  const cap = window.Capacitor;
  if (WEB) return pinPrompt(reason);
  if (!NATIVE) { if (confirm(reason + '\n(حالت تست — اثر انگشت واقعی فقط در APK)')) return true; throw new Error('تأیید لغو شد'); }
  const NB = cap.Plugins && cap.Plugins.NativeBiometric;
  if (!NB) throw new Error('افزونه اثر انگشت نصب نشده است');
  const a = await NB.isAvailable();
  if (!a.isAvailable) throw new Error('اثر انگشت یا قفل صفحه روی این گوشی فعال نیست');
  await NB.verifyIdentity({ reason, title: 'تأیید هویت', subtitle: reason });
  return true;
}

function unpair() { localStorage.removeItem(LS.token); localStorage.removeItem(PIN_KEY); localStorage.removeItem(PIN_FAIL); state = null; render(); }
function openSheet(html) { $('#sheet').innerHTML = `<div class="sheet"><div>${html}</div></div>`; }
function closeSheet() { $('#sheet').innerHTML = ''; }

// ---------- Setup ----------
function installTip() {
  if (WEB && ANDROID && apkLink) {
    return `<div class="tip"><b>اپ اندروید:</b> برای اثر انگشت و پیدا شدن خودکار کامپیوتر، اپ را نصب کنید:
    <a href="${esc(apkLink)}" style="color:var(--bl);font-weight:800">دانلود GameNet Remote</a> (با اینترنت گوشی).</div>`;
  }
  if (!WEB || !IOS || STANDALONE) return '';
  return `<div class="tip"><b>نصب روی آیفون:</b> در Safari دکمه اشتراک‌گذاری (مربع با فلش رو به بالا) پایین صفحه را بزنید و
  <b>Add to Home Screen</b> را انتخاب کنید. بعد برنامه را از صفحه اصلی گوشی باز کنید و آن‌جا جفت‌سازی کنید
  (آیفون اطلاعات Safari و برنامه نصب‌شده را جدا نگه می‌دارد).</div>`;
}

function renderSetup(msg = '') {
  const params = new URLSearchParams(location.search);
  const preCode = WEB ? (params.get('code') || '').replace(/\D/g, '').slice(0, 6) : '';
  $('#app').innerHTML = `<main>${installTip()}<div class="card"><div class="row" style="margin-bottom:8px"><div class="name">اتصال به برنامه گیم‌نت</div><button id="themeBtn" type="button" onclick="cycleTheme()"></button></div>
  <div class="mu">روی کامپیوتر: تنظیمات ← «ریموت موبایل» ← ساخت کد جفت‌سازی.</div>
  ${WEB
    ? `<div class="mu" style="margin:8px 0">کامپیوتر: <span dir="ltr">${esc(location.host)}</span></div>`
    : `<input id="host" dir="ltr" placeholder="192.168.1.10:4747" value="${esc((localStorage.getItem(LS.url) || '').replace('http://', ''))}">`}
  <input id="code" dir="ltr" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="کد ۶ رقمی" value="${esc(preCode)}">
  <input id="dev" placeholder="نام این گوشی" value="${esc(localStorage.getItem(LS.name) || (IOS ? 'آیفون' : ''))}">
  <div class="err" id="err">${esc(msg)}</div>
  <button id="go" style="width:100%">اتصال</button></div></main>`;
  applyTheme();
  $('#go').onclick = async () => {
    if (!WEB) {
      let host = $('#host').value.trim().replace(/^https?:\/\//, '').replace(/\/+$/, '');
      if (!host) return ($('#err').textContent = 'آدرس را وارد کنید');
      if (!/:\d+$/.test(host)) host += ':4747';
      localStorage.setItem(LS.url, 'http://' + host);
    }
    const name = $('#dev').value.trim() || 'گوشی';
    localStorage.setItem(LS.name, name);
    $('#go').disabled = true; $('#err').textContent = '';
    try {
      const j = await api('/api/pair', { method: 'POST', body: JSON.stringify({ code: toLatin($('#code').value), deviceName: name }) });
      localStorage.setItem(LS.token, j.token);
      if (WEB && location.search) history.replaceState(null, '', location.pathname);
      render(); poll();
    } catch (e) { $('#err').textContent = e.message; $('#go').disabled = false; }
  };
}

// ---------- Main ----------
function render() {
  if (!localStorage.getItem(LS.token)) return renderSetup();
  const T = [['systems', 'سیستم‌ها'], ['sale', 'بوفه'], ['debt', 'نسیه']];
  $('#app').innerHTML = `<header><div class="name">GameNet</div><div class="mu row"><span><span class="dot ${online ? 'ok' : ''}" id="dot"></span><span id="st">${online ? 'متصل' : 'قطع'}</span></span><button id="themeBtn" type="button" onclick="cycleTheme()"></button><button id="menuBtn" type="button" onclick="openMenu()" aria-label="تنظیمات">⚙️</button></div></header>
  <div id="conn"></div>
  <div class="tabs">${T.map(([k, l]) => `<div class="tab ${tab === k ? 'on' : ''}" data-t="${k}">${l}</div>`).join('')}</div>

function elapsed(s) {
  if (!s) return 0;
  const end = s.pausedTime ? new Date(s.pausedTime).getTime() : Date.now() + skew;
  return Math.max(0, end - new Date(s.startTime).getTime() - (s.totalPausedMs || 0));
}
function fmt(ms) {
  const t = Math.floor(ms / 1000), h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;
  return [h, m, s].map((v) => String(v).padStart(2, '0')).join(':');
}

async function send(body) {
  const r = await api('/api/cmd', { method: 'POST', body: JSON.stringify({ ...body, requestId: rid() }) });

  return r;
}

function picker(sel, cart, onChange) {
  const el = $(sel);
  el.innerHTML = state.buffet.map((b) => {
    const out = b.stock !== null && b.stock <= 0, I = esc(b.id);
    return `<div class="row item"><div><div class="nm">${esc(b.name)}</div><div class="mu">${money(b.price)}${b.stock !== null ? ' • موجودی ' + fa(b.stock) : ''}</div></div>

  }).join('') || '<div class="mu">آیتمی در بوفه نیست</div>';

// ---------- اتصال: عوض شدن IP کامپیوتر ----------
// توکن گوشی به IP وابسته نیست؛ کافی است آدرس جدید پیدا شود. جفت‌سازی دوباره لازم نیست.
let failCount = 0, discovering = false, lastDiscover = 0;
const hexToBin = (h) => h.replace(/../g, (x) => String.fromCharCode(parseInt(x, 16)));
function hmacHex(key, msg) { // key: حداکثر ۶۴ بایت ASCII
  let k = key; while (k.length < 64) k += '\x00';
  let ip = '', op = '';
  for (let i = 0; i < 64; i++) { const c = k.charCodeAt(i); ip += String.fromCharCode(c ^ 0x36); op += String.fromCharCode(c ^ 0x5c); }
  return sha256(op + hexToBin(sha256(ip + msg)));
}
function randHex(n) { const a = new Uint8Array(n); crypto.getRandomValues(a); return Array.from(a, (b) => b.toString(16).padStart(2, '0')).join(''); }

async function fetchJson(url, opts, ms) {
  const ctrl = new AbortController(), t = setTimeout(() => ctrl.abort(), ms);
  try { const r = await fetch(url, { ...opts, signal: ctrl.signal }); return r.ok ? await r.json() : null; }
  catch { return null; } finally { clearTimeout(t); }
}

// فقط کامپیوتری که هش توکن این گوشی را دارد جواب درست می‌دهد؛ توکن به هیچ دستگاه دیگری فرستاده نمی‌شود
async function probe(base, tokenHash, kid) {
  const ping = await fetchJson(base + '/api/ping', {}, 1500);
  if (!ping || ping.app !== 'gamenet-manager') return false;
  const nonce = randHex(16);
  const r = await fetchJson(base + '/api/hello', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ kid, nonce }) }, 2500);
  return !!r && r.proof === hmacHex(tokenHash, nonce);
}

async function discover(manual) {
  const token = localStorage.getItem(LS.token);
  if (WEB || discovering || !token) return;
  const m = /^http:\/\/(\d+)\.(\d+)\.(\d+)\.(\d+):(\d+)/.exec(localStorage.getItem(LS.url) || '');
  if (!m) { if (manual) openAddress(); return; }
  discovering = true; lastDiscover = Date.now(); updateConnBanner();
  const tokenHash = sha256(token), kid = sha256(tokenHash);
  const prefix = `${m[1]}.${m[2]}.${m[3]}.`, port = m[5];
  const hosts = [];
  for (let i = 1; i < 255; i++) if (String(i) !== m[4]) hosts.push(`http://${prefix}${i}:${port}`);
  let found = null, idx = 0;
  const worker = async () => { while (!found && idx < hosts.length) { const h = hosts[idx++]; if (await probe(h, tokenHash, kid)) found = found || h; } };
  await Promise.all(Array.from({ length: 24 }, worker));
  discovering = false;
  if (found) {
    localStorage.setItem(LS.url, found);
    failCount = 0;
    toast('کامپیوتر پیدا شد: ' + found.replace('http://', ''));
    poll();
  } else if (manual) {
    toast('کامپیوتر در این شبکه پیدا نشد؛ آدرس را دستی وارد کنید', true);
  }
  updateConnBanner();
}

function updateConnBanner() {
  const el = $('#conn');
  if (!el) return;
  if (online || failCount < 2) { el.innerHTML = ''; return; }
  if (WEB) {
    el.innerHTML = `<div class="conn"><b>ارتباط با کامپیوتر برقرار نیست.</b><br>
      برنامه گیم‌نت روی کامپیوتر باز است؟ اگر IP کامپیوتر عوض شده، از تنظیمات ← ریموت موبایل QR جدید را اسکن کنید.</div>`;
    return;
  }
  el.innerHTML = `<div class="conn"><b>ارتباط با کامپیوتر برقرار نیست.</b>
    ${discovering ? '<div>در حال جستجوی کامپیوتر در شبکه…</div>' : '<div>اگر IP کامپیوتر عوض شده، جستجو کنید یا آدرس جدید را وارد کنید. نیازی به جفت‌سازی دوباره نیست.</div>'}
    <div class="acts"><button id="cdisc" ${discovering ? 'disabled' : ''}>جستجوی خودکار</button><button class="s" id="caddr">تغییر آدرس</button></div></div>`;
  $('#cdisc').onclick = () => discover(true);
  $('#caddr').onclick = openAddress;
}

function openAddress() {
  const cur = (localStorage.getItem(LS.url) || '').replace('http://', '');
  openSheet(`<div class="name">آدرس کامپیوتر</div>
  <div class="mu" style="margin:6px 0">آدرس جدید را از تنظیمات ← «ریموت موبایل» روی کامپیوتر ببینید.</div>
  <input id="naddr" dir="ltr" placeholder="192.168.1.10:4747" value="${esc(cur)}">
  <div class="err" id="err"></div>
  <div class="row"><button class="s" id="x" style="flex:1">انصراف</button><button id="ok" style="flex:2">ذخیره و اتصال</button></div>`);
  $('#x').onclick = closeSheet;
  $('#ok').onclick = async () => {
    let host = $('#naddr').value.trim().replace(/^https?:\/\//, '').replace(/\/+$/, '');
    if (!host) return ($('#err').textContent = 'آدرس را وارد کنید');
    if (!/:\d+$/.test(host)) host += ':4747';
    $('#ok').disabled = true; $('#err').textContent = '';
    const token = localStorage.getItem(LS.token);
    const th = sha256(token);
    if (!(await probe('http://' + host, th, sha256(th)))) {
      $('#ok').disabled = false;
      return ($('#err').textContent = 'برنامه گیم‌نت با این گوشی در این آدرس پیدا نشد');
    }
    localStorage.setItem(LS.url, 'http://' + host);
    failCount = 0; closeSheet(); toast('آدرس ذخیره شد'); poll();
  };
}

function openMenu() {
  const t = getTheme();
  openSheet(`<div class="name" style="margin-bottom:6px">تنظیمات</div>
  <div class="mu" style="margin-bottom:10px">${WEB ? 'کامپیوتر: <span dir="ltr">' + esc(location.host) + '</span>' : 'کامپیوتر: <span dir="ltr">' + esc((localStorage.getItem(LS.url) || '').replace('http://', '')) + '</span>'}</div>
  <div class="menu">
    <button class="s" data-m="theme">تم: ${THEME_ICON[t]} ${THEME_LABEL[t]}</button>
    ${WEB ? '' : '<button class="s" data-m="addr">تغییر آدرس کامپیوتر</button><button class="s" data-m="disc">جستجوی خودکار کامپیوتر</button>'}
    <button class="r" data-m="unpair">حذف این گوشی و جفت‌سازی دوباره</button>
    <button class="s" data-m="x">بستن</button>
  </div>`);
  document.querySelectorAll('[data-m]').forEach((b) => (b.onclick = () => {
    const m = b.dataset.m;
    if (m === 'theme') { cycleTheme(); openMenu(); }
    else if (m === 'addr') openAddress();
    else if (m === 'disc') { closeSheet(); discover(true); }
    else if (m === 'unpair') { if (confirm('اتصال این گوشی حذف شود؟ برای استفاده دوباره باید با کد جدید جفت شود.')) { closeSheet(); unpair(); } }
    else closeSheet();
  }));
}

// ---------- Polling ----------
async function poll() {
  if (!localStorage.getItem(LS.token)) return;
  try {
    const j = await api('/api/state');
    skew = j.serverTime - Date.now(); state = j.state; online = true; failCount = 0;
  } catch (e) {
    online = false; failCount++;
    // اندروید: بعد از ~۱۰ ثانیه قطعی، کامپیوتر را در شبکه پیدا کن (شاید IP عوض شده)
    if (!WEB && NATIVE && failCount >= 4 && !discovering && Date.now() - lastDiscover > 60000) discover(false);
  }
  updateConnBanner();
  const dot = $('#dot'); if (dot) { dot.className = 'dot ' + (online ? 'ok' : ''); $('#st').textContent = online ? 'متصل' : 'قطع'; }
  if (tab === 'sale' && state && !salePay && $('#list')) renderSale();
  if (!document.querySelector('.sheet')) renderList();
}
setInterval(poll, 2500);
render(); poll();
if (WEB && ANDROID) {
  fetch('/api/ping').then((r) => r.json()).then((j) => {
    if (j && typeof j.apk === 'string' && /^https:\/\//.test(j.apk)) { apkLink = j.apk; if (!localStorage.getItem(LS.token)) render(); }
  }).catch(() => {});
}
</script>
</body>
</html>
